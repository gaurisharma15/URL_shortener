
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>URL Shortener</h2>
    </header>

    <main class="container">

        <h1>Shorten your URL</h1>
        <p>Enter a long URL to create a short link.</p>

        <section class="panel">
            <form id="shorten-form">
                <label for="long-url">Enter URL:</label>
                <input
                    type="url"
                    id="long-url"
                    placeholder="https://example.com"
                    required
                >

                <button type="submit" id="shorten-button">
                    <span id="button-text">Shorten URL</span>
                </button>
            </form>

            <p id="shorten-message" class="message" role="status"></p>

            <div id="result" class="result hidden">
                <h3>Your Short URL</h3>

                <a
                    id="short-link"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                ></a>

                <button type="button" id="copy-button">
                    Copy Link
                </button>

                <p>Click the short link to test it.</p>
            </div>
        </section>

        <section class="panel">
            <h2>Check Link Statistics</h2>
            <p>Enter a short code to see its click count.</p>

            <form id="analytics-form">
                <label for="short-code">Short Code:</label>
                <input
                    type="text"
                    id="short-code"
                    placeholder="Enter short code"
                    required
                >

                <button type="submit" id="analytics-button">
                    Check Clicks
                </button>
            </form>

            <p id="analytics-message" class="message" role="status"></p>

            <div id="analytics-result" class="analytics-result hidden">
                <h3>Link Statistics</h3>

                <p>
                    Total clicks:
                    <strong id="click-count">0</strong>
                </p>

                <p>Original URL:</p>
                <a
                    id="analytics-url"
                    href="#"
                    target="_blank"
                    rel="noopener noreferrer"
                ></a>
            </div>
        </section>

    </main>

    <footer>
        <p>URL Shortener Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
